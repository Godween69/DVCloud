# DV Cloud: пример запуска (сервер, админка, сайт и своя база). Скопируйте как docker-compose.yml и поправьте.
# Порты опубликованы только на 127.0.0.1: наружу сайт выводит ваш обратный прокси (см. docs/DEPLOY.md).
# Подробно: docs/DEPLOY.md
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dvcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в файле .env рядом}
      POSTGRES_DB: dvcloud
    volumes:
      - dvcloud-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvcloud -d dvcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: { context: ., target: server }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: dvcloud.env
    environment:
      # Адрес базы внутри сети compose перекрывает значение из dvcloud.env.
      DVCLOUD_DATABASE_URL: postgres://dvcloud:${POSTGRES_PASSWORD}@db:5432/dvcloud
      DVCLOUD_DATA_DIR: /data
      # Внутри контейнера слушаем все адреса (значения 127.0.0.1 из dvcloud.env годятся для запуска без Docker).
      # Наружу порты не публикуются: до сервера дотягиваются только web и admin по сети compose.
      DVCLOUD_HOST: 0.0.0.0
      DVCLOUD_INTERNAL_HOST: 0.0.0.0
    volumes:
      # Каталог с вашими файлами. Хозяин должен быть пользователь 1000 (в контейнере это node):
      # sudo chown 1000:1000 ./data
      - ./data:/data
    networks: [default, ml]   # ml нужна только для поиска по смыслу (см. ниже), без службы ml она пустая

  admin:
    build: { context: ., target: admin }
    restart: unless-stopped
    depends_on: [server]
    env_file: dvcloud.env
    environment:
      DVCLOUD_INTERNAL_URL: http://server:3006
      DVCLOUD_ADMIN_HOST: 0.0.0.0     # внутри контейнера; наружу порт опубликован ниже только на 127.0.0.1
    ports:
      - "127.0.0.1:3005:3005"   # админка: только локально, наружу не выводить

  # Поиск по смыслу (необязательно, см. docs/SEARCH.md). Включается профилем: docker compose --profile search up -d
  # Файлы модели положите в ./models (visual/model.onnx, textual/model.onnx, textual/tokenizer.json) и задайте
  # серверу DVCLOUD_ML_URL=http://ml:8090. Сеть закрытая: служба не выходит в интернет и снаружи не видна.
  ml:
    build: ./apps/ml
    profiles: ["search"]
    restart: unless-stopped
    environment:
      DVML_MODEL_DIR: /models/model
      DVML_THREADS: "2"
    volumes:
      - ./models:/models:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 2400m
    cpus: 2
    networks: [ml]

  # Вход в Яндекс по QR (необязательно, см. docs/YANDEX.md). Включается профилем: docker compose --profile yandex up -d
  # Нужны DVCLOUD_SECRETS_KEY и DVCLOUD_YANDEX_LOGIN_TOKEN в dvcloud.env, а серверу ещё DVCLOUD_YANDEX_LOGIN_URL=http://login:8099.
  # Службе нужен выход в интернет (к Яндексу), но наружу она не публикуется: с ней говорит только сервер.
  login:
    build: { context: ., target: login }
    profiles: ["yandex"]
    restart: unless-stopped
    env_file: dvcloud.env
    environment:
      PORT: "8099"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 1g

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "127.0.0.1:8080:80"     # сайт и /api: за вашим прокси с HTTPS

volumes:
  dvcloud-db:

networks:
  ml:
    internal: true   # без выхода наружу
